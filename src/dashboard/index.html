<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeamsSecretary Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🗂️</span>
        <span class="logo-text">TeamsSecretary</span>
      </div>
      <div class="header-stats" id="stats-bar">
        <span class="stat" id="stat-total">— items</span>
        <span class="stat meeting">📋 <span id="stat-meeting">0</span> meetings</span>
        <span class="stat task">✅ <span id="stat-task">0</span> tasks</span>
        <span class="stat note">📝 <span id="stat-note">0</span> notes</span>
        <span class="stat idea">💡 <span id="stat-idea">0</span> ideas</span>
      </div>
      <button class="btn-refresh" id="btn-refresh" title="Refresh">↻ Refresh</button>
    </div>
  </header>

  <!-- ── Filter bar ── -->
  <div class="filter-bar">
    <button class="filter-btn active" data-type="all">All</button>
    <button class="filter-btn" data-type="meeting">📋 Meetings</button>
    <button class="filter-btn" data-type="task">✅ Tasks</button>
    <button class="filter-btn" data-type="note">📝 Notes</button>
    <button class="filter-btn" data-type="idea">💡 Ideas</button>
  </div>

  <!-- ── Main content ── -->
  <main class="main">
    <div id="loading" class="loading-state">Loading…</div>
    <div id="empty"   class="empty-state" style="display:none">
      <p>No items yet.<br>Send a message to your Teams bot to get started.</p>
    </div>
    <div id="items-grid" class="items-grid"></div>
  </main>

  <!-- ── Item detail modal ── -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
